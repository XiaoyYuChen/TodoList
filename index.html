<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>做自律的小朋友 · 每日计划</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --ink: #111;
    --row-h: 8.4mm;
  }

  html, body { margin: 0; padding: 0; }

  body {
    background: #eef0f3;
    color: var(--ink);
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", "Songti SC", serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  input { font-family: inherit; color: inherit; }

  /* ---------- 工具栏（仅屏幕显示） ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    background: rgba(255, 255, 255, .94);
    border-bottom: 1px solid #dfe3e8;
    backdrop-filter: blur(8px);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand strong { font-size: 14px; color: #2b3440; letter-spacing: .5px; }
  .brand span { font-size: 11.5px; color: #8a94a6; }

  .actions { display: flex; gap: 10px; flex-shrink: 0; }

  .toolbar button {
    border: 1px solid #cfd6df;
    background: #fff;
    color: #333;
    border-radius: 8px;
    padding: 7px 15px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .toolbar button:hover { background: #f4f6f9; border-color: #b9c2cd; }
  .toolbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .toolbar button.primary:hover { background: #1a62d2; }

  /* ---------- A4 页面 ---------- */
  .page-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 12px 64px;
  }

  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 8mm;
    background: #fff;
    box-shadow: 0 10px 34px rgba(16, 24, 40, .16);
    border-radius: 2px;
    zoom: var(--zoom, 1);
  }

  /* ---------- 页头 ---------- */
  .page-head {
    display: grid;
    grid-template-columns: 1fr 52mm;
    align-items: start;
    padding-bottom: 3mm;
  }

  .title-block { text-align: center; padding-top: 1mm; }

  .title-block h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: 4px;
    font-weight: 700;
  }

  .title-block .sub {
    margin: 3px 0 0;
    font-size: 15px;
    letter-spacing: 5px;
    color: #222;
  }

  .name-block { justify-self: end; }

  .name-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    height: 9.5mm;
    border: 1px solid var(--ink);
  }

  .name-cell { position: relative; border-right: 1px solid var(--ink); }
  .name-cell:last-child { border-right: none; }
  .name-cell::before,
  .name-cell::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  .name-cell::before { left: 50%; top: 0; bottom: 0; border-left: 1px dashed #c2c2c2; }
  .name-cell::after { top: 50%; left: 0; right: 0; border-top: 1px dashed #c2c2c2; }

  .name-cell input {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    outline: none;
    text-align: center;
    font-size: 18px;
    padding: 0;
  }

  .name-tip {
    margin-top: 1.5mm;
    text-align: center;
    font-size: 10px;
    letter-spacing: .5px;
    color: #333;
    white-space: nowrap;
  }

  /* ---------- 日期栏 ---------- */
  .date-bar {
    height: 13mm;
    margin-bottom: 3mm;
    border: 1.4px solid var(--ink);
    display: flex;
    align-items: center;
    gap: 4mm;
    padding: 0 5mm;
  }

  .date-label {
    font-size: 16px;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .date-fields {
    flex: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 2mm;
    font-size: 14px;
    white-space: nowrap;
  }

  .date-fields input {
    border: 0;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    outline: none;
    text-align: center;
    font-size: 15px;
    padding: 0 1mm;
    height: 6mm;
  }
  .date-fields .y { width: 17mm; }
  .date-fields .m { width: 9mm; }
  .date-fields .d { width: 9mm; }
  .date-fields .w { width: 8mm; }
  .date-fields .week { margin-left: 2mm; }

  .weather { display: flex; align-items: center; gap: 3mm; }
  .w-icon {
    width: 7mm;
    height: 7mm;
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.25;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- 计划表 ---------- */
  .planner { display: flex; gap: 2mm; margin-bottom: 3mm; }

  .plan-table,
  .time-table {
    border-collapse: collapse;
    table-layout: fixed;
    border: 1.4px solid var(--ink);
  }

  .plan-table { width: 134mm; }
  .time-table { width: 58mm; }

  .plan-table th,
  .plan-table td,
  .time-table th,
  .time-table td {
    border: 1px solid var(--ink);
    padding: 0;
  }

  .plan-table thead th { height: 7mm; }
  .plan-table th.th-plan {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .plan-table th.th-mark {
    width: 8mm;
    font-size: 13px;
    font-weight: 700;
  }

  .plan-table tbody tr { height: var(--row-h); }

  .plan-table td.cat {
    width: 17mm;
    text-align: center;
    vertical-align: middle;
    font-size: 14px;
    font-weight: 600;
  }

  .plan-table td.cat span {
    display: inline-block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 5px;
    line-height: 1.15;
  }

  .plan-table td.todo-cell { position: relative; }

  .todo-cell .no {
    position: absolute;
    left: 1.2mm;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    color: #555;
    font-family: "Songti SC", "SimSun", serif;
    pointer-events: none;
  }

  .todo-input {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    outline: none;
    font-size: 13.5px;
    letter-spacing: .3px;
    padding: 0 4.5mm 0 5.5mm;
  }
  .todo-input:focus { background: #f1f6ff; }

  .pick {
    position: absolute;
    right: .6mm;
    top: 50%;
    transform: translateY(-50%);
    width: 4mm;
    height: 4mm;
    padding: 0;
    border: 0;
    background: transparent;
    color: #98a2b3;
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .todo-cell:hover .pick,
  .todo-input:focus + .pick { opacity: 1; }

  .mark-cell { text-align: center; }

  .mark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .mark .box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3.6mm;
    height: 3.6mm;
    border: 1px solid var(--ink);
    font-size: 11px;
    line-height: 1;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .mark.is-check .box::after { content: "✓"; font-weight: 700; }
  .mark.is-cross .box::after { content: "✕"; font-weight: 700; }

  /* ---------- 用时 ---------- */
  .time-table th.th-time {
    height: 7mm;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .time-table tbody tr { height: var(--row-h); }

  .time-cell { text-align: center; }

  .time {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5mm;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .t-label {
    font-size: 6.5px;
    line-height: 1;
    font-family: "Microsoft YaHei", sans-serif;
    color: #222;
  }

  .t-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.6mm;
    height: 2.6mm;
    border: 1px solid var(--ink);
    font-size: 7px;
    line-height: 1;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .time.is-on .t-box::after { content: "✓"; font-weight: 700; }

  /* ---------- 底部 ---------- */
  .bottom { display: flex; gap: 2mm; }

  .notes,
  .summary {
    height: 33mm;
    border: 1.4px solid var(--ink);
  }

  .notes {
    width: 134mm;
    padding: 2.5mm 3.5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .note-row {
    display: flex;
    align-items: flex-end;
    gap: 1mm;
    font-size: 13px;
    height: 7mm;
  }

  .note-label { width: 12mm; flex-shrink: 0; line-height: 1.2; }

  .line-input {
    flex: 1;
    height: 6mm;
    border: 0;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    outline: none;
    font-size: 12px;
    padding: 0 1mm;
  }

  .summary {
    width: 58mm;
    padding: 3mm 3.5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 13px;
  }

  .sum-row { display: flex; align-items: center; gap: 1.5mm; height: 5mm; }
  .sum-label { width: 10mm; flex-shrink: 0; }

  .t-num {
    width: 7.5mm;
    height: 5mm;
    border: 0;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    outline: none;
    text-align: center;
    font-size: 13px;
    padding: 0;
  }

  .colon { margin: 0 -.5mm; }

  .stars { display: flex; gap: 1mm; font-size: 15px; line-height: 1; }

  .star {
    color: #c9ced6;
    cursor: pointer;
    user-select: none;
    transition: color .12s;
  }
  .star.on { color: var(--ink); }

  /* ---------- 下拉建议 ---------- */
  .suggest {
    position: fixed;
    z-index: 200;
    display: none;
    max-height: 210px;
    overflow: auto;
    padding: 4px;
    background: #fff;
    border: 1px solid #dfe3e8;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(16, 24, 40, .18);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .suggest.open { display: block; }

  .sug-head {
    padding: 5px 10px 2px;
    font-size: 10.5px;
    letter-spacing: .5px;
    color: #98a2b3;
  }

  .sug-item {
    padding: 6px 10px;
    font-size: 12.5px;
    border-radius: 7px;
    color: #2b3440;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sug-item:hover,
  .sug-item.active { background: #eef4ff; color: #1f6feb; }

  .sug-empty {
    padding: 12px 10px;
    font-size: 12px;
    color: #98a2b3;
    text-align: center;
  }

  .sug-top {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 4px 6px 4px 10px;
    background: #fff;
    border-bottom: 1px solid #f1f3f6;
    font-size: 10.5px;
    letter-spacing: .5px;
    color: #98a2b3;
  }

  .sug-close {
    border: 0;
    background: transparent;
    color: #98a2b3;
    font-size: 15px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sug-close:hover { background: #f2f4f7; color: #475467; }

  /* ---------- 常用项配置弹窗 ---------- */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(17, 24, 39, .45);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .modal-mask.open { display: flex; }

  .modal {
    display: flex;
    flex-direction: column;
    width: min(560px, 100%);
    max-height: 86vh;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .25);
    overflow: hidden;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
  }
  .modal-head h2 { margin: 0; font-size: 16px; color: #1f2937; }

  .modal-x {
    border: 0;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    color: #98a2b3;
    padding: 2px 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  .modal-x:hover { background: #f2f4f7; color: #475467; }

  .modal-tip {
    margin: 0;
    padding: 0 20px 12px;
    font-size: 12px;
    line-height: 1.65;
    color: #8a94a6;
  }

  .cfg-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 20px 12px;
  }

  .cfg-tab {
    border: 1px solid #dfe3e8;
    background: #fff;
    color: #475467;
    padding: 5px 13px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .cfg-tab:hover { border-color: #b9c2cd; }
  .cfg-tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

  .cfg-panel {
    flex: 1;
    overflow: auto;
    padding: 0 20px 18px;
  }

  .cfg-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 36px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px 5px 10px;
    background: #f2f6fd;
    border: 1px solid #dbe6f7;
    border-radius: 8px;
    font-size: 12.5px;
    color: #1e4f9c;
  }

  .chip button {
    border: 0;
    background: transparent;
    padding: 0 2px;
    color: #7b93b8;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .chip button:hover { color: #d92d20; }

  .cfg-empty {
    width: 100%;
    padding: 6px 0;
    font-size: 12px;
    color: #98a2b3;
  }

  .cfg-add { display: flex; gap: 8px; margin-top: 16px; }

  .cfg-add input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #d0d7e2;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .cfg-add input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31, 111, 235, .12); }

  .cfg-add button {
    border: 1px solid #1f6feb;
    background: #1f6feb;
    color: #fff;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  .cfg-add button:hover { background: #1a62d2; }

  .modal-foot {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 20px;
    background: #fbfcfd;
    border-top: 1px solid #eef0f3;
  }

  .modal-foot button {
    border: 1px solid #cfd6df;
    background: #fff;
    color: #333;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .modal-foot button:hover { background: #f4f6f9; }
  .modal-foot button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .modal-foot button.primary:hover { background: #1a62d2; }

  /* ---------- 打印 ---------- */
  @media print {
    @page { size: A4 portrait; margin: 8mm; }

    html, body { background: #fff; }

    .toolbar,
    .suggest,
    .modal-mask { display: none !important; }

    .page-wrap { display: block; padding: 0; }

    .page {
      width: auto;
      min-height: 0;
      padding: 0;
      box-shadow: none;
      border-radius: 0;
      zoom: 1 !important;
    }

    .pick { display: none !important; }

    .todo-input:focus,
    .line-input:focus { background: transparent !important; }

    .star { color: #111 !important; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">
    <strong>每日计划 · 做自律的小朋友</strong>
    <span>输入内容会自动记住；点击格子右侧 ▾ 可从历史 / 常用配置中快速选择</span>
  </div>
  <div class="actions">
    <button type="button" id="configBtn">常用项配置</button>
    <button type="button" id="clearBtn">清空内容</button>
    <button type="button" id="clearHistoryBtn">清除历史</button>
    <button type="button" id="printBtn" class="primary">打印</button>
  </div>
</div>

<main class="page-wrap">
  <div class="page" id="page">

    <header class="page-head">
      <div class="title-block">
        <h1>做自律的小朋友</h1>
        <p class="sub">养成好习惯</p>
      </div>
      <div class="name-block">
        <div class="name-grid" id="nameGrid">
          <div class="name-cell"><input type="text" maxlength="1" aria-label="姓名第1字"></div>
          <div class="name-cell"><input type="text" maxlength="1" aria-label="姓名第2字"></div>
          <div class="name-cell"><input type="text" maxlength="1" aria-label="姓名第3字"></div>
          <div class="name-cell"><input type="text" maxlength="1" aria-label="姓名第4字"></div>
          <div class="name-cell"><input type="text" maxlength="1" aria-label="姓名第5字"></div>
        </div>
        <div class="name-tip">认真书写你的名字</div>
      </div>
    </header>

    <section class="date-bar">
      <span class="date-label">日期 / Date</span>
      <span class="date-fields">
        <input type="text" id="year" class="y" inputmode="numeric" aria-label="年"> 年
        <input type="text" id="month" class="m" inputmode="numeric" aria-label="月"> 月
        <input type="text" id="day" class="d" inputmode="numeric" aria-label="日"> 日
        <span class="week">周</span>
        <input type="text" id="weekday" class="w" maxlength="1" aria-label="星期">
      </span>
      <div class="weather" aria-hidden="true">
        <svg class="w-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.4"></circle>
          <path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"></path>
        </svg>
        <svg class="w-icon" viewBox="0 0 24 24">
          <path d="M6.8 18.2h10.6a3.6 3.6 0 0 0 .5-7.2 5 5 0 0 0-9.6-1.1 4 4 0 0 0-1.5 8.3Z"></path>
        </svg>
        <svg class="w-icon" viewBox="0 0 24 24">
          <path d="M6.8 14.4h10.6a3.4 3.4 0 0 0 .5-6.8 4.8 4.8 0 0 0-9.2-1 3.8 3.8 0 0 0-1.9 7.8Z"></path>
          <path d="M8.3 17.2l-.9 2.5M12.1 17.2l-.9 2.5M15.9 17.2l-.9 2.5"></path>
        </svg>
      </div>
    </section>

    <section class="planner">
      <table class="plan-table">
        <colgroup>
          <col style="width:17mm">
          <col>
          <col style="width:8mm">
          <col style="width:8mm">
        </colgroup>
        <thead>
          <tr>
            <th colspan="2" class="th-plan">每日计划 / To do list</th>
            <th class="th-mark">√</th>
            <th class="th-mark">×</th>
          </tr>
        </thead>
        <tbody id="planBody"></tbody>
      </table>

      <table class="time-table">
        <colgroup>
          <col><col><col><col><col><col><col>
        </colgroup>
        <thead>
          <tr><th colspan="7" class="th-time">用时 / Time</th></tr>
        </thead>
        <tbody id="timeBody"></tbody>
      </table>
    </section>

    <section class="bottom">
      <div class="notes">
        <div class="note-row">
          <span class="note-label">补充：</span>
          <input type="text" id="supp1" class="line-input">
        </div>
        <div class="note-row">
          <span class="note-label"></span>
          <input type="text" id="supp2" class="line-input">
        </div>
        <div class="note-row">
          <span class="note-label">评语：</span>
          <input type="text" id="comment" class="line-input">
        </div>
      </div>

      <div class="summary">
        <div class="sum-row">
          <span class="sum-label">起床</span>
          <input type="text" id="wakeH" class="t-num" inputmode="numeric" maxlength="2" aria-label="起床时">
          <span class="colon">:</span>
          <input type="text" id="wakeM" class="t-num" inputmode="numeric" maxlength="2" aria-label="起床分">
        </div>
        <div class="sum-row">
          <span class="sum-label">睡觉</span>
          <input type="text" id="sleepH" class="t-num" inputmode="numeric" maxlength="2" aria-label="睡觉时">
          <span class="colon">:</span>
          <input type="text" id="sleepM" class="t-num" inputmode="numeric" maxlength="2" aria-label="睡觉分">
        </div>
        <div class="sum-row">
          <span class="sum-label">效率</span>
          <span class="stars" data-key="efficiency"></span>
        </div>
        <div class="sum-row">
          <span class="sum-label">书写</span>
          <span class="stars" data-key="writing"></span>
        </div>
        <div class="sum-row">
          <span class="sum-label">正确</span>
          <span class="stars" data-key="accuracy"></span>
        </div>
      </div>
    </section>

  </div>
</main>

<div class="modal-mask" id="configModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="常用项配置">
    <div class="modal-head">
      <h2>常用项配置</h2>
      <button type="button" class="modal-x" id="configCloseX" aria-label="关闭">×</button>
    </div>
    <p class="modal-tip">这里的项目会出现在下拉框的「常用配置」分组中；手动输入过的内容仍会自动进入「历史记录」。</p>
    <div class="cfg-tabs" id="cfgTabs"></div>
    <div class="cfg-panel" id="cfgPanel"></div>
    <div class="modal-foot">
      <button type="button" id="cfgReset">恢复本类默认</button>
      <button type="button" id="cfgDone" class="primary">完成</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var NO = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];

  var CATS = [
    { key: 'chinese', name: '语文', rows: 6 },
    { key: 'math',    name: '数学', rows: 5 },
    { key: 'english', name: '英语', rows: 4 },
    { key: 'sport',   name: '运动', rows: 4 },
    { key: 'other',   name: '其他', rows: 4 }
  ];

  var DEFAULT_ITEMS = {
    '语文': ['阅读20分钟', '读书笔记', '书法', '预习', '复习', '晨读'],
    '数学': ['五三天天练', '每日一练', '单元测试', '浅奥', '口算'],
    '英语': ['晨读', '背单词', '短文', '英语课', '口语', '听力'],
    '运动': ['跳绳', '短跑', '长跑', '手球', '体能', '核心'],
    '其他': ['牙齿管理', '腿型管理', '遛狗', '家务劳动']
  };

  var TIME_LABELS = ['10', '20', '30', '40', '50', '60', '>60'];

  var HKEY = 'zl_history_v1';
  var SKEY = 'zl_state_v1';
  var DKEY = 'zl_defaults_v1';

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var val = JSON.parse(raw);
      return val == null ? fallback : val;
    } catch (e) {
      return fallback;
    }
  }

  function blankState() {
    return {
      name: ['', '', '', '', ''],
      date: { y: '', m: '', d: '', w: '' },
      rows: {},
      notes: {},
      clock: {},
      stars: {},
      autoDate: ''
    };
  }

  var history = load(HKEY, {});
  var state = load(SKEY, null);
  if (!state || typeof state !== 'object') state = blankState();

  var customDefaults = load(DKEY, null);
  if (!customDefaults || typeof customDefaults !== 'object' || Array.isArray(customDefaults)) {
    customDefaults = null;
  }

  var base = blankState();
  ['date', 'rows', 'notes', 'clock', 'stars'].forEach(function (k) {
    if (!state[k] || typeof state[k] !== 'object') state[k] = base[k];
  });
  if (!Array.isArray(state.name) || state.name.length !== 5) state.name = ['', '', '', '', ''];
  if (typeof state.autoDate !== 'string') state.autoDate = '';

  /* ---------- 生成表格 ---------- */
  var planBody = document.getElementById('planBody');
  var timeBody = document.getElementById('timeBody');
  var pageEl = document.getElementById('page');

  var planHTML = '';
  var timeHTML = '';

  CATS.forEach(function (cat) {
    for (var i = 0; i < cat.rows; i++) {
      var id = cat.key + '-' + i;
      planHTML +=
        '<tr data-id="' + id + '">' +
          (i === 0
            ? '<td class="cat" rowspan="' + cat.rows + '"><span>' + cat.name + '</span></td>'
            : '') +
          '<td class="todo-cell">' +
            '<span class="no">' + NO[i] + '</span>' +
            '<input class="todo-input" type="text" autocomplete="off" spellcheck="false" data-id="' + id + '" data-cat="' + cat.name + '">' +
            '<button type="button" class="pick" tabindex="-1" aria-label="选择常用项目">▾</button>' +
          '</td>' +
          '<td class="mark-cell"><button type="button" class="mark" data-id="' + id + '" data-kind="check" aria-label="完成"><span class="box"></span></button></td>' +
          '<td class="mark-cell"><button type="button" class="mark" data-id="' + id + '" data-kind="cross" aria-label="未完成"><span class="box"></span></button></td>' +
        '</tr>';

      timeHTML += '<tr data-id="' + id + '">';
      TIME_LABELS.forEach(function (t) {
        timeHTML +=
          '<td class="time-cell">' +
            '<button type="button" class="time" data-id="' + id + '" data-time="' + t + '">' +
              '<span class="t-label">' + t + '</span>' +
              '<span class="t-box"></span>' +
            '</button>' +
          '</td>';
      });
      timeHTML += '</tr>';
    }
  });

  planBody.innerHTML = planHTML;
  timeBody.innerHTML = timeHTML;

  /* ---------- 状态保存 ---------- */
  var saveTimer = null;

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 200);
  }

  function saveState() {
    try {
      localStorage.setItem(SKEY, JSON.stringify(state));
    } catch (e) { /* 忽略存储异常 */ }
  }

  function rowState(id) {
    if (!state.rows[id]) state.rows[id] = {};
    return state.rows[id];
  }

  /* ---------- 历史记录 ---------- */
  function saveHistory() {
    try {
      localStorage.setItem(HKEY, JSON.stringify(history));
    } catch (e) { /* 忽略存储异常 */ }
  }

  function addHistory(cat, value) {
    var v = String(value || '').trim();
    if (!v) return;
    if (!Array.isArray(history[cat])) history[cat] = [];
    var list = history[cat].filter(function (x) { return x !== v; });
    list.unshift(v);
    if (list.length > 60) list.length = 60;
    history[cat] = list;
    saveHistory();
  }

  /* ---------- 常用项（可在配置界面修改） ---------- */
  function getDefaults(cat) {
    if (customDefaults && Array.isArray(customDefaults[cat])) return customDefaults[cat].slice();
    return (DEFAULT_ITEMS[cat] || []).slice();
  }

  function ensureCustom() {
    if (customDefaults) return;
    customDefaults = {};
    CATS.forEach(function (c) {
      customDefaults[c.name] = (DEFAULT_ITEMS[c.name] || []).slice();
    });
  }

  function saveDefaults() {
    try {
      localStorage.setItem(DKEY, JSON.stringify(customDefaults || {}));
    } catch (e) { /* 忽略存储异常 */ }
  }

  // 旧数据迁移：教务活动 -> 家务劳动
  (function migrate() {
    var changed = false;
    Object.keys(history).forEach(function (cat) {
      if (Array.isArray(history[cat])) {
        var next = history[cat].map(function (v) {
          return v === '教务活动' ? '家务劳动' : v;
        });
        if (next.join('\u0001') !== history[cat].join('\u0001')) {
          history[cat] = next;
          changed = true;
        }
      }
    });
    if (changed) saveHistory();

    if (customDefaults) {
      var dChanged = false;
      Object.keys(customDefaults).forEach(function (cat) {
        if (Array.isArray(customDefaults[cat])) {
          var arr = customDefaults[cat].map(function (v) {
            return v === '教务活动' ? '家务劳动' : v;
          });
          if (arr.join('\u0001') !== customDefaults[cat].join('\u0001')) {
            customDefaults[cat] = arr;
            dChanged = true;
          }
        }
      });
      if (dChanged) saveDefaults();
    }
  })();

  /* ---------- 恢复输入内容 ---------- */
  document.querySelectorAll('.todo-input').forEach(function (inp) {
    var r = state.rows[inp.dataset.id] || {};
    inp.value = r.text || '';
  });

  function paintRow(id) {
    var r = state.rows[id] || {};

    var planRow = planBody.querySelector('tr[data-id="' + id + '"]');
    if (planRow) {
      planRow.querySelectorAll('.mark').forEach(function (btn) {
        btn.classList.toggle('is-check', r.mark === 'check' && btn.dataset.kind === 'check');
        btn.classList.toggle('is-cross', r.mark === 'cross' && btn.dataset.kind === 'cross');
      });
    }

    timeBody.querySelectorAll('.time[data-id="' + id + '"]').forEach(function (btn) {
      btn.classList.toggle('is-on', r.time === btn.dataset.time);
    });
  }

  CATS.forEach(function (cat) {
    for (var i = 0; i < cat.rows; i++) paintRow(cat.key + '-' + i);
  });

  /* ---------- 姓名 ---------- */
  var nameInputs = Array.prototype.slice.call(document.querySelectorAll('.name-cell input'));
  nameInputs.forEach(function (el, idx) {
    el.value = state.name[idx] || '';
    el.addEventListener('input', function () {
      state.name[idx] = el.value.slice(0, 1);
      saveSoon();
      if (el.value && nameInputs[idx + 1]) nameInputs[idx + 1].focus();
    });
  });

  /* ---------- 日期（默认为当天） ---------- */
  function todayParts() {
    var d = new Date();
    return {
      y: String(d.getFullYear()),
      m: String(d.getMonth() + 1),
      d: String(d.getDate()),
      w: '日一二三四五六'.charAt(d.getDay())
    };
  }

  if (!state.date.y && !state.date.m && !state.date.d && !state.date.w) {
    state.date = todayParts();
    state.autoDate = state.date.y + '-' + state.date.m + '-' + state.date.d;
    saveSoon();
  } else if (state.autoDate) {
    // 上次是自动填入的日期：换天后自动更新为当天
    var savedKey = state.date.y + '-' + state.date.m + '-' + state.date.d;
    if (savedKey === state.autoDate) {
      var nowDate = todayParts();
      var nowKey = nowDate.y + '-' + nowDate.m + '-' + nowDate.d;
      if (nowKey !== savedKey) {
        state.date = nowDate;
        state.autoDate = nowKey;
        saveSoon();
      }
    }
  }

  [['year', 'y'], ['month', 'm'], ['day', 'd'], ['weekday', 'w']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    el.value = state.date[pair[1]] || '';
    el.addEventListener('input', function () {
      state.date[pair[1]] = el.value;
      state.autoDate = '';
      saveSoon();
    });
  });

  /* ---------- 补充 / 评语 ---------- */
  [['supp1', 'supp1'], ['supp2', 'supp2'], ['comment', 'comment']].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    el.value = state.notes[pair[1]] || '';
    el.addEventListener('input', function () {
      state.notes[pair[1]] = el.value;
      saveSoon();
    });
  });

  /* ---------- 起床 / 睡觉 ---------- */
  ['wakeH', 'wakeM', 'sleepH', 'sleepM'].forEach(function (key) {
    var el = document.getElementById(key);
    el.value = state.clock[key] || '';
    el.addEventListener('input', function () {
      state.clock[key] = el.value;
      saveSoon();
    });
  });

  /* ---------- 星级 ---------- */
  document.querySelectorAll('.stars').forEach(function (box) {
    var key = box.dataset.key;
    for (var i = 0; i < 5; i++) {
      var s = document.createElement('span');
      s.className = 'star';
      s.textContent = '☆';
      box.appendChild(s);
    }
    paintStars(box, state.stars[key] || 0);

    box.addEventListener('click', function (e) {
      var star = e.target.closest('.star');
      if (!star) return;
      var idx = Array.prototype.indexOf.call(box.children, star) + 1;
      state.stars[key] = state.stars[key] === idx ? 0 : idx;
      paintStars(box, state.stars[key]);
      saveSoon();
    });
  });

  function paintStars(box, n) {
    Array.prototype.forEach.call(box.children, function (s, i) {
      var on = i < n;
      s.classList.toggle('on', on);
      s.textContent = on ? '★' : '☆';
    });
  }

  /* ---------- 勾选 / 用时 ---------- */
  planBody.addEventListener('click', function (e) {
    var mark = e.target.closest('.mark');
    if (!mark) return;
    var id = mark.dataset.id;
    var r = rowState(id);
    r.mark = r.mark === mark.dataset.kind ? null : mark.dataset.kind;
    paintRow(id);
    saveState();
  });

  timeBody.addEventListener('click', function (e) {
    var btn = e.target.closest('.time');
    if (!btn) return;
    var id = btn.dataset.id;
    var r = rowState(id);
    r.time = r.time === btn.dataset.time ? null : btn.dataset.time;
    paintRow(id);
    saveState();
  });

  /* ---------- 下拉建议 ---------- */
  var sug = document.createElement('div');
  sug.className = 'suggest';
  document.body.appendChild(sug);

  var activeInput = null;
  var sugList = [];
  var activeIndex = -1;

  function openSuggest(input) {
    activeInput = input;
    renderSuggest('');
  }

  function renderSuggest(query) {
    if (!activeInput) return;

    var cat = activeInput.dataset.cat;
    var hist = Array.isArray(history[cat]) ? history[cat] : [];
    var defs = getDefaults(cat);
    var q = String(query || '').trim();

    var seen = {};
    var histItems = [];
    var defItems = [];

    hist.forEach(function (v) {
      if (!seen[v]) { seen[v] = 1; histItems.push(v); }
    });
    defs.forEach(function (v) {
      if (!seen[v]) { seen[v] = 1; defItems.push(v); }
    });

    function match(v) { return !q || v.indexOf(q) !== -1; }
    histItems = histItems.filter(match);
    defItems = defItems.filter(match);

    sug.innerHTML = '';
    sugList = [];
    activeIndex = -1;

    var top = document.createElement('div');
    top.className = 'sug-top';
    var topText = document.createElement('span');
    topText.textContent = '点击选择，手动输入会自动记录';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'sug-close';
    closeBtn.setAttribute('aria-label', '关闭下拉');
    closeBtn.textContent = '×';
    top.appendChild(topText);
    top.appendChild(closeBtn);
    sug.appendChild(top);

    function addHead(text) {
      var h = document.createElement('div');
      h.className = 'sug-head';
      h.textContent = text;
      sug.appendChild(h);
    }

    function addItem(v) {
      var d = document.createElement('div');
      d.className = 'sug-item';
      d.dataset.value = v;
      d.textContent = v;
      sug.appendChild(d);
      sugList.push(v);
    }

    if (histItems.length) {
      addHead('历史记录');
      histItems.forEach(addItem);
    }
    if (defItems.length) {
      addHead('常用配置');
      defItems.forEach(addItem);
    }
    if (!sugList.length) {
      var empty = document.createElement('div');
      empty.className = 'sug-empty';
      empty.textContent = q ? '没有匹配项，输入后会记住' : '输入内容后会自动记住，下次可快速选择';
      sug.appendChild(empty);
    }

    sug.classList.add('open');
    placeSuggest();
  }

  function placeSuggest() {
    if (!activeInput) return;
    var cell = activeInput.closest('.todo-cell');
    if (!cell) return;
    var r = cell.getBoundingClientRect();
    var gap = 3;
    var h = sug.offsetHeight;
    var spaceBelow = window.innerHeight - r.bottom - 8;
    var top = r.bottom + gap;

    if (h > spaceBelow && r.top - h - gap > 8) {
      top = r.top - h - gap;
    }

    sug.style.left = Math.round(r.left) + 'px';
    sug.style.top = Math.round(Math.max(8, top)) + 'px';
    sug.style.width = Math.max(Math.round(r.width), 170) + 'px';
  }

  function closeSuggest() {
    sug.classList.remove('open');
    activeInput = null;
    sugList = [];
    activeIndex = -1;
  }

  function choose(value) {
    if (!activeInput) return;
    var id = activeInput.dataset.id;
    activeInput.value = value;
    var r = rowState(id);
    r.text = value;
    addHistory(activeInput.dataset.cat, value);
    saveSoon();
    closeSuggest();
  }

  function paintActive() {
    var items = sug.querySelectorAll('.sug-item');
    Array.prototype.forEach.call(items, function (el, i) {
      el.classList.toggle('active', i === activeIndex);
    });
    if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
  }

  planBody.addEventListener('focusin', function (e) {
    if (e.target.classList && e.target.classList.contains('todo-input')) {
      openSuggest(e.target);
    }
  });

  planBody.addEventListener('click', function (e) {
    var inp = e.target.closest('.todo-input');
    if (inp && activeInput !== inp) openSuggest(inp);
  });

  planBody.addEventListener('input', function (e) {
    var inp = e.target;
    if (!inp.classList || !inp.classList.contains('todo-input')) return;
    var r = rowState(inp.dataset.id);
    r.text = inp.value;
    saveSoon();
    if (activeInput === inp && sug.classList.contains('open')) {
      renderSuggest(inp.value);
    }
  });

  planBody.addEventListener('focusout', function (e) {
    var inp = e.target;
    if (!inp.classList || !inp.classList.contains('todo-input')) return;
    addHistory(inp.dataset.cat, inp.value);
    var r = rowState(inp.dataset.id);
    r.text = inp.value.trim();
    saveSoon();
    // 下拉框保持显示，直到选择项目或手动关闭
  });

  planBody.addEventListener('mousedown', function (e) {
    var pick = e.target.closest('.pick');
    if (!pick) return;
    e.preventDefault();
    var input = pick.parentElement.querySelector('.todo-input');
    if (input) {
      input.focus();
      openSuggest(input);
    }
  });

  planBody.addEventListener('keydown', function (e) {
    var inp = e.target;
    if (!inp.classList || !inp.classList.contains('todo-input')) return;

    if (!sug.classList.contains('open')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        openSuggest(inp);
      }
      return;
    }

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var n = sugList.length;
      if (!n) return;
      activeIndex = e.key === 'ArrowDown'
        ? (activeIndex + 1) % n
        : (activeIndex - 1 + n) % n;
      paintActive();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && sugList[activeIndex]) {
        choose(sugList[activeIndex]);
      } else {
        closeSuggest();
        inp.blur();
      }
    } else if (e.key === 'Escape') {
      closeSuggest();
    }
  });

  sug.addEventListener('mousedown', function (e) {
    e.preventDefault();
    if (e.target.closest('.sug-close')) {
      closeSuggest();
      return;
    }
    var item = e.target.closest('.sug-item');
    if (!item) return;
    choose(item.dataset.value);
  });

  window.addEventListener('resize', function () {
    if (sug.classList.contains('open')) placeSuggest();
  });
  window.addEventListener('scroll', function () {
    if (sug.classList.contains('open')) placeSuggest();
  }, true);

  /* ---------- 常用项配置 ---------- */
  var configModal = document.getElementById('configModal');
  var cfgTabs = document.getElementById('cfgTabs');
  var cfgPanel = document.getElementById('cfgPanel');
  var cfgCat = CATS[0].name;
  var cfgDraft = '';

  function renderCfgTabs() {
    cfgTabs.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cfg-tab' + (c.name === cfgCat ? ' active' : '');
      b.textContent = c.name;
      b.addEventListener('click', function () {
        cfgCat = c.name;
        cfgDraft = '';
        renderCfgTabs();
        renderCfgPanel();
      });
      cfgTabs.appendChild(b);
    });
  }

  function renderCfgPanel() {
    cfgPanel.innerHTML = '';
    var items = getDefaults(cfgCat);

    var chips = document.createElement('div');
    chips.className = 'cfg-chips';

    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'cfg-empty';
      empty.textContent = '暂无常用项，可在下方添加。';
      chips.appendChild(empty);
    }

    items.forEach(function (value) {
      var chip = document.createElement('span');
      chip.className = 'chip';

      var text = document.createElement('span');
      text.textContent = value;

      var del = document.createElement('button');
      del.type = 'button';
      del.setAttribute('aria-label', '删除 ' + value);
      del.textContent = '×';
      del.addEventListener('click', function () {
        ensureCustom();
        customDefaults[cfgCat] = customDefaults[cfgCat].filter(function (v) {
          return v !== value;
        });
        saveDefaults();
        renderCfgPanel();
      });

      chip.appendChild(text);
      chip.appendChild(del);
      chips.appendChild(chip);
    });

    cfgPanel.appendChild(chips);

    var addRow = document.createElement('div');
    addRow.className = 'cfg-add';

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '添加常用项，例如：晨读';
    input.value = cfgDraft;

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '添加';

    function submit() {
      var v = input.value.trim();
      if (!v) return;
      ensureCustom();
      if (customDefaults[cfgCat].indexOf(v) === -1) {
        customDefaults[cfgCat].push(v);
        saveDefaults();
      }
      cfgDraft = '';
      renderCfgPanel();
      var next = cfgPanel.querySelector('.cfg-add input');
      if (next) next.focus();
    }

    input.addEventListener('input', function () { cfgDraft = input.value; });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });
    addBtn.addEventListener('click', submit);

    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    cfgPanel.appendChild(addRow);
  }

  function openConfig() {
    closeSuggest();
    cfgDraft = '';
    renderCfgTabs();
    renderCfgPanel();
    configModal.classList.add('open');
    configModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeConfig() {
    configModal.classList.remove('open');
    configModal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    cfgDraft = '';
  }

  document.getElementById('configBtn').addEventListener('click', openConfig);
  document.getElementById('configCloseX').addEventListener('click', closeConfig);
  document.getElementById('cfgDone').addEventListener('click', closeConfig);

  document.getElementById('cfgReset').addEventListener('click', function () {
    if (!window.confirm('将「' + cfgCat + '」的常用项恢复为默认配置？')) return;
    if (customDefaults) {
      delete customDefaults[cfgCat];
      saveDefaults();
    }
    cfgDraft = '';
    renderCfgPanel();
  });

  configModal.addEventListener('mousedown', function (e) {
    if (e.target === configModal) closeConfig();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && configModal.classList.contains('open')) closeConfig();
  });

  /* ---------- 工具栏操作 ---------- */
  document.getElementById('printBtn').addEventListener('click', function () {
    document.querySelectorAll('.todo-input').forEach(function (inp) {
      addHistory(inp.dataset.cat, inp.value);
    });
    saveState();
    closeSuggest();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    window.print();
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (!window.confirm('清空当前填写的内容？（历史记录会保留）')) return;
    try {
      localStorage.removeItem(SKEY);
    } catch (e) { /* 忽略存储异常 */ }
    window.location.reload();
  });

  document.getElementById('clearHistoryBtn').addEventListener('click', function () {
    if (!window.confirm('清除所有历史记录？（常用配置仍会保留）')) return;
    try {
      localStorage.removeItem(HKEY);
    } catch (e) { /* 忽略存储异常 */ }
    history = {};
    closeSuggest();
  });

  /* ---------- 小屏自适应缩放 ---------- */
  function applyZoom() {
    var avail = document.documentElement.clientWidth - 28;
    var pageWidthPx = 210 * 96 / 25.4;
    var z = Math.min(1, avail / pageWidthPx);
    pageEl.style.setProperty('--zoom', z.toFixed(3));
  }
  applyZoom();
  window.addEventListener('resize', applyZoom);
})();
</script>
</body>
</html>
